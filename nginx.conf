server {
    listen 80;
    server_name _;

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    # Must be before the /api/ block (exact match takes priority).
    # App Service terminates TLS; connections arrive here as plain HTTP/WS.
    location = /ws {
        proxy_pass         http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep alive for long-lived connections
    }

    # ── FastAPI REST API proxy ────────────────────────────────────────────────
    # FastAPI already has /api prefix in its routers — pass the full path through
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long timeout for LLM/Foundry calls
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;  # allow Excel file uploads
    }

    # ── React SPA (static files + HTML5 history fallback) ────────────────────
    location / {
        root  /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Long-term caching for fingerprinted assets (Vite generates hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
}
